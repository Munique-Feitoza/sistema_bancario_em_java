# src/main/resources/application.yml
# Perfil DEFAULT: H2 em memoria (roda na hora, sem dependencias externas).
# Para PostgreSQL: rode com SPRING_PROFILES_ACTIVE=postgres (ver application-postgres.yml).
spring:
  application:
    name: digital-bank

  datasource:
    url: jdbc:h2:mem:bank;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway e dono do schema; Hibernate apenas valida o mapeamento
    open-in-view: false           # evita lazy-loading fora da camada transacional
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # Instant -> TIMESTAMP (casa com o schema Flyway)

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true               # http://localhost:8080/h2-console (apenas dev)
      path: /h2-console

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50        # clamp do parametro ?size (evita paginas gigantes / DoS)

server:
  port: 8080
  max-http-request-header-size: 16KB   # rejeita headers gigantes (DoS)
  tomcat:
    max-swallow-size: 2MB              # limita o corpo lido para requisicoes rejeitadas
    max-http-form-post-size: 256KB
  error:
    include-message: never        # nao vaza mensagens internas no corpo de erro
    include-stacktrace: never     # NUNCA expor stack trace (CWE-209)
    include-binding-errors: never

# Configuracao da aplicacao (lida por classes @ConfigurationProperties / @Value)
app:
  security:
    jwt:
      # Em producao SEMPRE sobrescreva via variavel de ambiente JWT_SECRET (>= 32 chars).
      secret: ${JWT_SECRET:change-me-in-production-this-is-a-256bit-dev-secret-please-override}
      issuer: digital-bank
      expiration-minutes: 60
    login:
      max-attempts: 5             # anti-brute-force: bloqueia apos N falhas...
      lockout-minutes: 15         # ...por esta janela (por username + IP)
    cors:
      # Origens permitidas do front-end (sem curinga). Sobrescreva por ambiente.
      allowed-origins: http://localhost:5173,http://localhost:3000

# OpenAPI / Swagger
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

# Actuator: expoe apenas health/info
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true            # /actuator/health/liveness e /readiness (Docker/K8s)

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
